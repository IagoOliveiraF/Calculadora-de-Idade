<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <title>Frontend Mentor | Age calculator app</title>
  <link rel="stylesheet" href="./CSS/style.css">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->

</head>

<body>

  <main id="main_container">
    <form>
      <header id="main_container_header">



        <div id="day_input" class="input_age_information">
          <h3 id="dayTitle">DAY</h3>
          <section>
            <input name="day_input" type="text" placeholder="DD" maxLength="2" id="day_input">
            <label class="errorMessage" for="day_input"></label>
          </section>
        </div>

        <div id="month_input" class="input_age_information">
          <h3 id="monthTitle">MONTH</h3>
          <section>
            <input name="month_input" type="text" placeholder="MM" maxLength="2" id="month_input">
            <label class="errorMessage" for="month_input"></label>
          </section>
        </div>

        <div id="year_input" class="input_age_information">
          <h3 id="yearTitle">YEAR</h3>
          <section>
            <input name="year_input" type="text" placeholder="YYYY" maxLength="4" id="year_input">
            <label class="errorMessage" for="year_input"></label>
          </section>
        </div>
      </header>

      <article id="main_container_article">
        <hr>
        <div class="arrow_icon_image_container" onclick="calculateAge()">
          <img src="./assets/images/icon-arrow.svg" alt="arrow icon">
        </div>

      </article>

      </section>

      <footer id="main_container_footer">
        <div class="age_calculator_results">
          <h1 id="year">--</h1>
          <p>years</p>
        </div>
        <div class="age_calculator_results">
          <h1 id="month">--</h1>
          <p>months</p>
        </div>
        <div class="age_calculator_results">
          <h1 id="day">--</h1>
          <p>days</p>
        </div>

      </footer>

    </form>
  </main>

  <script src="./JS/script.js"></script>
</body>

</html>
